[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teo"
version = "1.1.5"
description = "The Teo programming language"
requires-python = ">=3.14"

[project.scripts]
teo = "teo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
